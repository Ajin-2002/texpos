services:
  - type: web
    name: texpos-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false   # Set this in Render dashboard (MongoDB Atlas URI)
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard
      - key: JWT_EXPIRE
        value: 7d
      - key: ADMIN_NAME
        sync: false   # Set this in Render dashboard
      - key: ADMIN_EMAIL
        sync: false   # Set this in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false   # Set this in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # Set this to your Vercel URL in Render dashboard
